<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14352A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hop & Harten</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%2314352A'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23d8695f'%3E%E2%99%A5%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --baize:#14352A; --baize-deep:#0E251D; --baize-line:rgba(255,255,255,.10);
  --parch:#EFE6D0; --parch-dim:#E1D3B3; --parch-line:rgba(25,23,18,.14);
  --ink:#191712; --ink-soft:#4a4438; --bone:#F6EFE0; --bone-dim:#c9c3b1;
  --rood:#B23A34; --rood-soft:#d8695f; --brass:#C9A24B; --brass-deep:#9c7a2f;
  --groen-ok:#5c9a6f;
  --r:14px; --r-sm:9px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --tap:48px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Inter,system-ui,sans-serif; color:var(--bone);
  background:radial-gradient(90% 42% at 50% 0%, var(--persona-tint, transparent), transparent 62%), radial-gradient(120% 90% at 50% -10%, #1c463a 0%, var(--baize) 45%, var(--baize-deep) 100%);
  background-attachment:fixed; min-height:100dvh; -webkit-text-size-adjust:100%;
  padding-bottom:calc(104px + env(safe-area-inset-bottom)); transition:background .5s;
}
.persona-hi{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,var(--parch),var(--parch-dim));color:var(--ink);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.35);margin-bottom:14px}
.persona-hi .ph-emoji{font-size:30px;flex:0 0 auto}
.persona-hi .ph-name{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:17px}
.persona-hi .ph-line{font-size:12.5px;color:var(--ink-soft);margin-top:1px}
.twist-banner{background:linear-gradient(90deg,rgba(201,162,75,.22),rgba(178,58,52,.18));border:1px solid var(--brass-deep);color:var(--bone);border-radius:var(--r-sm);padding:10px 12px;font-weight:600;font-size:13.5px;margin:8px 0 0;text-align:center}
.hr-rule{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;color:var(--ink);margin:12px 0;line-height:1.2}
.hr-who{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;color:var(--ink)}
.hc-list{margin:14px 0 20px}
.hc-banner{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;background:linear-gradient(90deg,rgba(178,58,52,.30),rgba(178,58,52,.16));border:1px solid var(--rood);border-radius:var(--r);padding:13px 12px 13px 14px}
.hc-banner + .hc-banner{margin-top:8px}
.hc-banner .hcb-l{display:flex;align-items:flex-start;gap:11px;min-width:0;flex:1}
.hc-banner .hcb-who{font-weight:700;font-size:13px;color:var(--bone);letter-spacing:.01em}
.hc-banner .hcb-rule{font-size:13px;color:var(--bone-dim);line-height:1.45;margin-top:3px}
.hc-banner .hcb-x{background:transparent;border:0;color:var(--rood-soft);font-size:18px;width:34px;height:34px;flex:0 0 auto;margin:-4px -4px 0 0}
.hc-freq{display:flex;gap:6px;margin-top:10px}
.hc-freq button{flex:1;background:rgba(0,0,0,.06);border:1px solid var(--parch-line);color:var(--ink-soft);border-radius:var(--r-sm);padding:10px 4px;font-weight:700;font-size:13px}
.hc-freq button.on{background:var(--brass);border-color:var(--brass-deep);color:#241c07}
.boete-card{background:linear-gradient(160deg,#B23A34,#7d2823);color:#fff;border-radius:var(--r);padding:14px 16px;margin-top:12px;text-align:center;box-shadow:var(--shadow)}
.boete-card .bc-eye{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.boete-card .bc-who{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px;margin:4px 0 2px}
.boete-card .bc-rule{font-size:14px;opacity:.96}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{padding:calc(env(safe-area-inset-top) + 18px) 16px 10px;position:relative}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{flex:0 0 auto;line-height:0;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.head-txt{min-width:0}
header .wm{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;letter-spacing:-.01em;line-height:1;color:var(--bone);display:flex;align-items:center;gap:9px}
header .wm .suits{font-size:17px;letter-spacing:2px}
header .wm .suits .r{color:var(--rood-soft)}
header .sub{color:var(--bone-dim);font-size:12px;margin-top:5px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h2.view-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:22px;margin:18px 0 4px;letter-spacing:-.01em}
.muted{color:var(--bone-dim);font-size:13px;line-height:1.5}
.eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass)}
.mono{font-family:'Space Mono',monospace}
.card{background:linear-gradient(180deg,var(--parch) 0%, var(--parch-dim) 100%);color:var(--ink);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.35);position:relative}
.card + .card{margin-top:12px}
button{font-family:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:0 18px;border-radius:var(--r-sm);font-weight:600;font-size:15px;border:1px solid transparent;width:100%}
.btn.brass{background:var(--brass);color:#241c07;border-color:var(--brass-deep)}
.btn.brass:active{background:var(--brass-deep)}
.btn.ghost{background:transparent;color:var(--bone);border-color:var(--baize-line)}
.btn.ghost.dark{color:var(--ink);border-color:var(--parch-line)}
.btn.red{background:var(--rood);color:#fff}
.btn.small{min-height:38px;padding:0 12px;font-size:13px;width:auto}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-row{display:flex;gap:10px;margin-top:12px}
.games{display:grid;gap:12px;margin-top:14px}
.game-tile{text-align:left;border-radius:var(--r);padding:16px 16px 14px;color:var(--ink);border:1px solid rgba(255,255,255,.4);box-shadow:var(--shadow);position:relative;overflow:hidden;width:100%}
.game-tile .gt-suit{position:absolute;right:-6px;top:-14px;font-size:96px;opacity:.10;line-height:1}
.game-tile h3{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px;margin:0}
.game-tile p{margin:4px 0 0;font-size:12.5px;color:var(--ink-soft);max-width:80%}
.tile-toepen{background:linear-gradient(160deg,#f0e3c8,#e6d3ab)}
.tile-toepen .gt-suit{color:var(--rood)}
.tile-bb{background:linear-gradient(160deg,#eae7cf,#d9dcb6)}
.tile-bb .gt-suit{color:#2c5b3f}

.standings{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:10px;background:var(--parch);color:var(--ink);border-radius:var(--r-sm);padding:10px 12px;border:1px solid var(--parch-line)}
.srow .rank{font-family:'Space Mono',monospace;font-size:12px;color:var(--ink-soft)}
.idcell{display:flex;align-items:center;gap:9px;min-width:0}
.srow .nm{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .tot{font-family:'Space Mono',monospace;font-weight:700;font-size:22px;letter-spacing:-.02em}
.srow.leader{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.srow.leader .rank::after{content:"♛";color:var(--brass-deep);margin-left:1px}
.srow.dead{opacity:.55}
.srow.dead .nm::after{content:" · dood";color:var(--rood);font-weight:600;font-size:12px}
.nmwrap{min-width:0}
.meter{height:5px;border-radius:3px;background:rgba(25,23,18,.14);margin-top:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--groen-ok);transition:width .2s,background .2s}
.meter.warn i{background:var(--brass)}
.meter.danger i{background:var(--rood)}

.round-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px}
.round-head .rn{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px;color:var(--ink)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--parch-line);border-radius:var(--r-sm);overflow:hidden;background:#fff}
.stepper button{width:40px;height:40px;border:0;background:transparent;font-size:20px;color:var(--ink);font-family:'Space Mono',monospace}
.stepper button:active{background:rgba(0,0,0,.06)}
.stepper .val{min-width:34px;text-align:center;font-family:'Space Mono',monospace;font-weight:700;font-size:16px;color:var(--ink)}
.field-lbl{font-size:12px;color:var(--ink-soft);font-weight:600;margin-bottom:6px;display:block}
.prow{display:grid;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--parch-line)}
.prow:first-of-type{border-top:0}
.pnmcell{display:flex;align-items:center;gap:8px;min-width:0}
.pnm{font-weight:600;color:var(--ink);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow.bb{grid-template-columns:1fr 60px 60px 46px}
.prow.tp{grid-template-columns:auto 1fr auto}
.num{width:100%;height:44px;border:1px solid var(--parch-line);border-radius:var(--r-sm);text-align:center;font-family:'Space Mono',monospace;font-weight:700;font-size:17px;color:var(--ink);background:#fff;-moz-appearance:textfield}
.num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num:focus{outline:2px solid var(--brass);outline-offset:0}
.num:disabled{background:#efe9db;color:var(--ink-soft)}
.num.bad{border-color:var(--rood);outline:2px solid var(--rood);background:#fbeceb}
.pts{font-family:'Space Mono',monospace;font-weight:700;font-size:15px;text-align:right;color:var(--ink)}
.pts.neg{color:var(--rood)}
.pts.pos{color:var(--groen-ok)}
.colhead{display:grid;gap:10px;padding:0 0 6px;font-size:11px;color:var(--ink-soft);font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:.05em}
.colhead.bb{grid-template-columns:1fr 60px 60px 46px}
.colhead.tp{grid-template-columns:auto 1fr auto}
.straf-step{display:flex;align-items:center;gap:6px}
.ss-btn{width:38px;height:44px;border:1px solid var(--parch-line);border-radius:var(--r-sm);background:#fff;font-family:'Space Mono',monospace;font-size:20px;line-height:1;color:var(--ink);flex:0 0 auto}
.ss-btn:active{background:rgba(0,0,0,.06)}
.ss-btn:disabled{opacity:.35}
.ss-num{width:48px!important;flex:0 0 auto}
.cancel-game{color:var(--bone-dim);font-size:13px;font-weight:500;border-color:transparent}
.cancel-game:active{color:var(--rood-soft)}
.colhead span{text-align:center}
.colhead span:first-child{text-align:left}
.colhead span:last-child{text-align:right}
.dealer-hint{font-size:11.5px;font-weight:600;margin-top:3px;color:var(--ink-soft)}
.dealer-hint.block{color:var(--rood)}
.win-radio{width:26px;height:26px;border-radius:50%;border:2px solid var(--parch-line);display:inline-flex;align-items:center;justify-content:center;background:#fff}
.win-radio.on{border-color:var(--brass);background:var(--brass)}
.win-radio.on::after{content:"♛";font-size:13px;color:#241c07}
.chk{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--ink-soft);margin-top:12px;cursor:pointer;line-height:1.4}
.chk .box{flex:0 0 auto;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--parch-line);background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px;margin-top:1px}
.chk .box::after{content:""}
.chk.on .box{background:var(--rood);border-color:var(--rood);color:#fff}
.chk.on .box::after{content:"✓"}
.chk-txt{flex:1}
.hint{font-size:11.5px;color:var(--ink-soft);margin-top:8px;line-height:1.45}
.hint b{color:var(--ink)}
.sumbar{display:flex;gap:14px;margin-top:10px;font-family:'Space Mono',monospace;font-size:12px}
.sumbar .s b{font-size:15px}
.sumbar .ok{color:var(--groen-ok)} .sumbar .warn{color:var(--brass-deep)} .sumbar .bad{color:var(--rood)}

/* avatars */
.av{width:34px;height:34px;border-radius:50%;background:var(--baize);color:var(--bone);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Bricolage Grotesque',sans-serif;flex:0 0 auto}
.av .emo{font-size:18px;line-height:1}
.av.sm{width:26px;height:26px;font-size:11px}
.av.sm .emo{font-size:13px}
.av.lg{width:56px;height:56px;font-size:20px}
.av.lg .emo{font-size:30px}
.avatar-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}
.avatar-grid .opt{aspect-ratio:1;border:1px solid var(--parch-line);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;padding:0;overflow:hidden}
.avatar-grid .opt .av{width:100%;height:100%;border-radius:9px}
.avatar-grid .opt.none{font-family:'Space Mono',monospace;font-size:12px;color:var(--ink-soft);font-weight:700}
.picker-wrap{background:rgba(0,0,0,.06);border-radius:var(--r-sm);padding:8px 10px;margin-top:-4px}

/* player mgmt */
.p-add{display:flex;gap:8px;margin-top:10px}
.p-add input{flex:1;height:var(--tap);border-radius:var(--r-sm);border:1px solid var(--baize-line);background:rgba(0,0,0,.2);color:var(--bone);padding:0 14px;font-size:15px}
.p-add input:focus{outline:2px solid var(--brass)}
.p-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.p-item{display:flex;align-items:center;gap:12px;background:var(--parch);color:var(--ink);border-radius:var(--r-sm);padding:10px 12px;border:1px solid var(--parch-line)}
.p-item .txt{flex:1;min-width:0}
.p-item .nm{font-weight:600}
.p-item .fotolink{font-size:11px;color:var(--ink-soft);margin-top:1px}
.p-item .fotolink b{color:var(--brass-deep)}
.p-item .x{background:transparent;border:0;color:var(--rood);font-size:22px;width:38px;height:38px;line-height:1}
.av-edit{position:relative;cursor:pointer}
.av-edit .cam{position:absolute;right:-2px;bottom:-2px;width:18px;height:18px;border-radius:50%;background:var(--brass);color:#241c07;font-size:10px;display:flex;align-items:center;justify-content:center;border:2px solid var(--parch)}
.sel-item{display:flex;align-items:center;gap:12px;background:var(--parch);color:var(--ink);border-radius:var(--r-sm);padding:10px 12px;border:1px solid var(--parch-line);cursor:pointer;user-select:none}
.sel-item.on{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.sel-item .box{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--parch-line);display:flex;align-items:center;justify-content:center;font-size:15px;background:#fff;flex:0 0 auto}
.sel-item.on .box{background:var(--brass);border-color:var(--brass-deep);color:#241c07}
.sel-item.on .box::after{content:"✓"}
.sel-item .nm{font-weight:600;flex:1}
.selbar{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.selbar .cnt{font-family:'Space Mono',monospace;font-size:12px;color:var(--bone-dim)}

/* reorder */
.reorder{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ro-item{display:flex;align-items:center;gap:10px;background:var(--parch);color:var(--ink);border-radius:var(--r-sm);padding:8px 10px;border:1px solid var(--parch-line)}
.ro-item .pos{font-family:'Space Mono',monospace;font-size:12px;color:var(--ink-soft);width:18px}
.ro-item .nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ro-item .ar{display:flex;gap:4px}
.ro-item .ar button{width:36px;height:36px;border-radius:8px;border:1px solid var(--parch-line);background:#fff;font-size:15px;color:var(--ink)}
.ro-item .ar button:disabled{opacity:.3}
.ro-item .lastflag{font-family:'Space Mono',monospace;font-size:10px;color:var(--brass-deep)}

.lb-item{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:12px;background:var(--parch);color:var(--ink);border-radius:var(--r-sm);padding:12px;border:1px solid var(--parch-line)}
.lb-item.top{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.lb-item .medal{font-family:'Space Mono',monospace;font-weight:700;font-size:15px;color:var(--ink-soft);text-align:center}
.lb-item.top .medal{color:var(--brass-deep)}
.lb-cell{display:flex;align-items:center;gap:10px;min-width:0}
.lb-item .nm{font-weight:600;font-size:16px}
.lb-item .split{font-family:'Space Mono',monospace;font-size:11px;color:var(--ink-soft);margin-top:2px}
.lb-item .wins{font-family:'Space Mono',monospace;font-weight:700;font-size:26px;line-height:1;text-align:right}
.lb-item .wins small{font-size:11px;color:var(--ink-soft);display:block;text-align:right;font-weight:400}

.rules h3{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;margin:14px 0 6px;color:var(--ink)}
.rules p{font-size:13.5px;line-height:1.6;color:var(--ink-soft);margin:6px 0}
.rules ul{margin:6px 0;padding-left:18px}
.rules li{font-size:13.5px;line-height:1.6;color:var(--ink-soft);margin:3px 0}
.rules .pill{display:inline-block;font-family:'Space Mono',monospace;font-size:11px;background:var(--baize);color:var(--bone);padding:2px 8px;border-radius:20px;letter-spacing:.04em}
.rules b{color:var(--ink)}
.win-banner{text-align:center;padding:22px 16px}
.win-banner .laurel{font-size:46px}
.win-banner .who{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:30px;color:var(--ink);margin:6px 0 2px}
.win-banner .cap{color:var(--ink-soft);font-size:13px}
.empty{text-align:center;padding:26px 14px;color:var(--bone-dim)}
.empty .big{font-size:40px;opacity:.5;margin-bottom:8px}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(10,26,20,.92);backdrop-filter:blur(10px);border-top:1px solid var(--baize-line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around}
nav.tabbar button{background:transparent;border:0;color:var(--bone-dim);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;padding:4px 10px;min-width:60px;border-radius:10px}
nav.tabbar button .ic{font-size:19px;line-height:1}
nav.tabbar button.on{color:var(--brass)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bone);padding:11px 16px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow);z-index:60;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.toast.err{background:var(--rood);color:#fff}
.sticky-standings{position:sticky;top:0;z-index:5;padding-top:10px;background:linear-gradient(180deg, var(--baize) 70%, transparent);margin:0 -16px;padding-left:16px;padding-right:16px}
.progress{display:flex;gap:3px;margin-top:8px;flex-wrap:wrap}
.progress i{width:9px;height:9px;border-radius:50%;background:rgba(25,23,18,.18)}
.progress i.done{background:var(--brass)}
.progress i.now{background:var(--ink);box-shadow:0 0 0 2px var(--brass)}
.divider{height:1px;background:var(--baize-line);margin:16px 0}
.badge-cfg{display:none}

function bbPunten(v,g){ v=Number(v)||0; g=Number(g)||0; return v===g?10+2*g:-2*Math.abs(v-g); }
function toepenRondePunten(r,id){
  if(id===r.winnaarId) return 0; // winnaar krijgt nooit (min)punten
  if(r.strafpunten && (id in r.strafpunten)) return Number(r.strafpunten[id])||0;
  return r.strafpunten ? 0 : (Number(r.inzet)||0)*(r.metBoer?2:1); }
function totaal(p,id){ let t=0;
  for(const r of p.rondes){
    if(p.spel==='toepen') t+=toepenRondePunten(r,id);
    else { const e=r.entries?.[id]; if(e) t+=bbPunten(e.voorspelling,e.gehaald); }
  } return t; }
function isDood(p,id){ return p.spel==='toepen' && totaal(p,id)>=DOOD; }

function rbOn(){ const v=sget('rb_on'); return (v!==undefined?v:gateGet('kv_rb_on'))!=='0'; }
function rbTargetId(){
  const t=sget('rb_target')||gateGet('kv_rb_target');

  const j=App.allSpelers.find(s=>['jelle','jelly'].includes((s.naam||'').trim().toLowerCase()));
  return j?j.id:null;
}
function amTarget(){ return rbOn() && App.me && App.me===rbTargetId(); }
function rbTypesFor(spel){ return RB_TYPES.filter(t=> t!=='C' || spel==='toepen'); }
function armCurseForPotje(p){
  App.curseChecked=p.id;
  App.curse=null; document.body && document.body.classList && document.body.classList.remove('rb-tilt-body');
  if(!App.me || !(p.spelerIds||[]).includes(App.me)) return;   // ik speel niet mee in dit potje
  const pend=consumePending(App.me);
  if(pend){ forcePendingCurse(p, pend); return; }               // door Tom toegewezen: gaat sowieso af
  if(!amTarget()) return;
  let cd=parseInt(gateGet('kv_rb_cd')||'0'); if(isNaN(cd))cd=0;
  if(cd>0){ gateSet('kv_rb_cd', String(cd-1)); return; }        // cooldown: geen ragebait
  if(Math.random()<0.6){                                          // soms tóch normaal
    const opts=rbTypesFor(p.spel); const type=opts[(Math.random()*opts.length)|0];
    App.curse={ potjeId:p.id, type, used:false, dodges:0, cSeen:0 };
    gateSet('kv_rb_cd','1');                                      // volgend potje sowieso rustig
    // triggers die meteen bij de start afgaan:
    if(type==='H') setTimeout(fakeDQ, 400);
    else if(type==='D') setTimeout(()=>toast(RB_ROASTS[(Math.random()*RB_ROASTS.length)|0](naamVan(App.me))), 500);
  }
}

}

function defaultDealer(p){
  const order=inputOrder(p);
  if(!p.rondes.length) return order[0];
  const prev=p.rondes[p.rondes.length-1].dealerId;
  const i=order.indexOf(prev);
  return i<0 ? order[p.rondes.length % order.length] : order[(i+1)%order.length];
}
function ensureDraft(p){
  if(App.draft && App.draft.potjeId===p.id && App.draft.ronde===p.rondes.length) return;
  if(p.spel==='toepen') App.draft={ potjeId:p.id, ronde:p.rondes.length, winnaarId:null, inzet:1, metBoer:false, strafpunten:{} };
  else { const entries={}; p.spelerIds.forEach(id=>entries[id]={voorspelling:'',gehaald:''});
    App.draft={ potjeId:p.id, ronde:p.rondes.length, entries, dealerId:defaultDealer(p) }; }
}

/* live recompute for boerenbridge */
function recalcBB(p,order){
  const cards=p.plan[p.rondes.length] ?? 0;
  const dealer=App.draft.dealerId;
  let sumBid=0, sumTrick=0, othersFilled=true, sumOthers=0, allBidFilled=true;
  for(const id of order){
    const e=App.draft.entries[id]||{voorspelling:'',gehaald:''};
    const vb=e.voorspelling==='' ? null : (Number(e.voorspelling)||0);
    const tr=e.gehaald==='' ? null : (Number(e.gehaald)||0);
    if(vb!==null) sumBid+=vb; else allBidFilled=false;
    if(tr!==null) sumTrick+=tr;
    if(id!==dealer){ if(vb===null) othersFilled=false; else sumOthers+=vb; }
    const cell=el.querySelector(`[data-pts="${id}"]`);
    if(cell){ if(vb!==null&&tr!==null){ const v=bbPunten(vb,tr); cell.textContent=v>0?'+'+v:v; cell.className='pts '+(v<0?'neg':'pos'); }
      else { cell.textContent='–'; cell.className='pts'; } }
  }
  const sb=document.getElementById('sumBid'), stt=document.getElementById('sumTrick');
  if(sb){ sb.innerHTML=`Voorspeld <b>${sumBid}</b>/${cards}`; sb.className='s '+(allBidFilled&&sumBid===cards?'bad':(sumBid>cards?'warn':'')); }
  if(stt){ stt.innerHTML=`Gehaald <b>${sumTrick}</b>/${cards}`; stt.className='s '+(sumTrick===cards?'ok':(sumTrick>cards?'bad':'warn')); }
  const forbidden = othersFilled ? cards - sumOthers : null;
  const hint=document.getElementById('dealerHint');
  const dealerInput=el.querySelector(`input[data-bb="voorspelling"][data-id="${dealer}"]`);
  if(hint){
    if(forbidden!==null && forbidden>=0 && forbidden<=cards){
      hint.textContent=`${naamVan(dealer)} (deler) mag niet ${forbidden} bieden — dan wordt het totaal ${cards}.`;
      hint.className='dealer-hint block';
    } else if(othersFilled){ hint.textContent=`${naamVan(dealer)} (deler) is vrij: elk bod mag.`; hint.className='dealer-hint'; }
    else { hint.textContent=`${naamVan(dealer)} deelt en biedt als laatste.`; hint.className='dealer-hint'; }
  }
  if(dealerInput){
    const lv=App.draft.entries[dealer]?.voorspelling;
    const bad = forbidden!==null && lv!=='' && lv!==undefined && (Number(lv)||0)===forbidden;
    dealerInput.classList.toggle('bad',!!bad);
  }
}

/* ============ ENGINES (rating · achievements · kans) ============ */
function finishedChrono(){
  return App.potjes.filter(p=>p.status==='afgerond')
    .slice().sort((a,b)=> new Date(a.afgerond||a.gestart) - new Date(b.afgerond||b.gestart));
}
function betterFirst(potje){ // ids best->worst
  return ordered(potje).map(r=>r.id);
}
/* Elo over eindklasseringen, verdeeld over alle tegenstanders */
function computeRatings(){
  const R={}, hist={}, games={};
  const get=id=>{ if(R[id]===undefined){R[id]=1000;hist[id]=[{i:0,r:1000}];games[id]=0;} };
  let step=0;
  for(const p of finishedChrono()){
    step++;
    const ids=p.spelerIds.slice(); ids.forEach(get);
    const n=ids.length; if(n<2) continue;
    const low=GAMES[p.spel].lowerIsBetter;
    const sc={}; ids.forEach(id=>sc[id]=totaal(p,id));
    const K=32/(n-1), delta={}; ids.forEach(id=>delta[id]=0);
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
      const a=ids[i], b=ids[j], sa=sc[a], sb=sc[b];
      let Sa; if(sa===sb) Sa=0.5; else Sa=(low? sa<sb : sa>sb)?1:0;
      const Ea=1/(1+Math.pow(10,(R[b]-R[a])/400));
      delta[a]+=K*(Sa-Ea); delta[b]+=K*((1-Sa)-(1-Ea));
    }
    ids.forEach(id=>{ R[id]+=delta[id]; games[id]++; hist[id].push({i:step,r:Math.round(R[id])}); });
  }
  return {R,hist,games};
}
/* per-speler aggregaten voor achievements & titels */
function playerAgg(){
  const A={};
  const g=id=>{ if(!A[id])A[id]={potjes:0,wins:0,winsToepen:0,winsBB:0,lasts:0,
    bbExact:0,bbZeroExact:0,bbBigExact:0,maxExactStreak:0,
    maxStrafRonde:0,boerWins:0,boerVictim:0,cleanToepenWin:false,fastDeath:false,comeback:false,
    nightWin:false,maxWinStreak:0,curWinStreak:0,winDays:{}}; return A[id]; };
  for(const p of App.potjes.filter(x=>x.status==='afgerond')){
    const ids=p.spelerIds, low=GAMES[p.spel].lowerIsBetter, rank=betterFirst(p);
    const lastId=rank[rank.length-1];
    ids.forEach(id=>g(id).potjes++);
    if(p.winnaarId){ const a=g(p.winnaarId); a.wins++; p.spel==='toepen'?a.winsToepen++:a.winsBB++;
      const day=(p.afgerond||p.gestart||'').slice(0,10); a.winDays[day]=(a.winDays[day]||0)+1;
      const hr=p.afgerond?new Date(p.afgerond).getHours():12; if(hr>=0&&hr<6)a.nightWin=true; }
    if(lastId) g(lastId).lasts++;
    if(p.spel==='boerenbridge'){
      ids.forEach(id=>{ const a=g(id); let streak=0;
        p.rondes.forEach((r,ri)=>{ const e=r.entries&&r.entries[id]; if(!e)return;
          if(Number(e.voorspelling)===Number(e.gehaald)){ a.bbExact++; streak++; if(streak>a.maxExactStreak)a.maxExactStreak=streak;
            if(Number(e.voorspelling)===0&&Number(e.gehaald)===0)a.bbZeroExact++;
            if((p.plan&&p.plan[ri])>=6)a.bbBigExact++;
          } else streak=0; }); });
    } else {

function winProb(potje,SIMS=2000){
  const ids=potje.spelerIds, n=ids.length;
  if(n<2||!potje.rondes.length) return null;
  const low=GAMES[potje.spel].lowerIsBetter;
  const base={}; ids.forEach(id=>base[id]=totaal(potje,id));
  const wins={}; ids.forEach(id=>wins[id]=0);
  if(potje.spel==='boerenbridge'){
    const remaining=potje.plan.slice(potje.rondes.length);
    if(!remaining.length){ const w=betterFirst(potje)[0]; wins[w]=SIMS; }
    else{
      const pool={}; ids.forEach(id=>pool[id]=[]); const global=[];
      potje.rondes.forEach(r=>ids.forEach(id=>{ const e=r.entries&&r.entries[id]; if(e){const v=bbPunten(e.voorspelling,e.gehaald);pool[id].push(v);global.push(v);} }));
      const prior=[-4,-2,-2,10,12,14,16];
      const smp=id=>{ const p=pool[id].length>=2?pool[id]:(global.length>=3?global:prior); return p[(Math.random()*p.length)|0]; };
      for(let s=0;s<SIMS;s++){ const t={}; ids.forEach(id=>t[id]=base[id]);
        for(let k=0;k<remaining.length;k++) ids.forEach(id=>t[id]+=smp(id));
        let bi=ids[0]; ids.forEach(id=>{ if(t[id]>t[bi])bi=id; }); wins[bi]++; }
    }
  } else {
    const share={}; ids.forEach(id=>share[id]=1);
    potje.rondes.forEach(r=>{ if(r.winnaarId)share[r.winnaarId]+=1; });
    const iz=potje.rondes.map(r=>r.inzet).filter(x=>x>0); const izPool=iz.length?iz:[1,1,2,2,3];
    for(let s=0;s<SIMS;s++){ const t={}; ids.forEach(id=>t[id]=base[id]);
      let alive=ids.filter(id=>t[id]<DOOD), guard=0;
      while(alive.length>1 && guard++<300){
        const ws=alive.reduce((a,id)=>a+share[id],0); let rr=Math.random()*ws, win=alive[0];
        for(const id of alive){ rr-=share[id]; if(rr<=0){win=id;break;} }
        const inz=izPool[(Math.random()*izPool.length)|0];
        alive.forEach(id=>{ if(id!==win)t[id]+=inz; });
        alive=alive.filter(id=>t[id]<DOOD);
      }
      let win = alive.length===1?alive[0]:ids.reduce((m,id)=>t[id]<t[m]?id:m,ids[0]);
      wins[win]++;
    }
  }
  const tot=Object.values(wins).reduce((a,b)=>a+b,0)||1, prob={};
  ids.forEach(id=>prob[id]=wins[id]/tot); return prob;
}
function kansMeterHTML(p){

function rivalries(){
  const pair={};
  for(const p of App.potjes.filter(x=>x.status==='afgerond')){
    const rank=ordered(p), pos={}; rank.forEach((r,i)=>pos[r.id]=i);
    const ids=p.spelerIds;
    for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){
      const key=[ids[i],ids[j]].sort().join('|');
      const o=pair[key]||(pair[key]={a:key.split('|')[0],b:key.split('|')[1],aWins:0,bWins:0,ties:0,shared:0,gapSum:0});
      const pa=pos[o.a], pb=pos[o.b]; o.shared++; o.gapSum+=Math.abs(pa-pb);
      if(pa<pb)o.aWins++; else if(pb<pa)o.bWins++; else o.ties++;
    }
  }
  const list=Object.values(pair).filter(o=>o.shared>=2);
  list.forEach(o=>{ o.avgGap=o.gapSum/o.shared; o.intensity=o.shared/(1+o.avgGap); });
  list.sort((x,y)=> y.intensity-x.intensity || y.shared-x.shared);
  return list;
}
function rivComment(o){
  if(o.aWins===o.bWins) return 'Perfect in evenwicht — dit beslist de vakantie nog.';
  const lead=o.aWins>o.bWins?o.a:o.b, other=lead===o.a?o.b:o.a;
  const w=Math.max(o.aWins,o.bWins), l=Math.min(o.aWins,o.bWins);
  if(l===0 && w>=3) return `${naamVan(lead)} loopt ongenadig over ${naamVan(other)} heen.`;
  if(w-l>=3) return `${naamVan(lead)} heeft duidelijk de overhand.`;
  if(o.avgGap<1.25) return 'Kop-aan-kop en messcherp — deze twee eindigen altijd naast elkaar.';
  return `${naamVan(lead)} leidt nipt; ${naamVan(other)} ademt in z'n nek.`;
}

function animateCounts(root){
  (root||document).querySelectorAll('.cu').forEach(elm=>{
    const to=parseInt(elm.dataset.to)||0; const dur=800, start=(performance&&performance.now?performance.now():Date.now());
    const tick=(now)=>{ const t=Math.min(1,((now||Date.now())-start)/dur); const e=1-Math.pow(1-t,3);
      elm.textContent=Math.round(to*e); if(t<1) requestAnimationFrame(tick); else elm.textContent=to; };
    requestAnimationFrame(tick);
  });
}

/* ---- Deler-rad (physics wheel) ---- */
const RAD_PROMPTS=['Wie deelt?','Wie haalt bier?','Wie schudt?'];
function promptVerb(){ const p=App.radPrompt; return p==='Wie haalt bier?'?'haalt bier!':p==='Wie schudt?'?'schudt!':'deelt!'; }
let audioCtx=null;
function ensureAudio(){ try{ if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended')audioCtx.resume(); }catch(e){} }
function tick(){ if(!audioCtx)return; try{ const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='square'; o.frequency.value=880; g.gain.setValueAtTime(0.05,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.045);
  o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+0.05); }catch(e){} }
function dingWin(){ if(!audioCtx)return; try{ const t=audioCtx.currentTime; [[0,660],[0.12,880],[0.24,1046]].forEach(([d,f])=>{ const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='triangle'; o.frequency.value=f; g.gain.setValueAtTime(0.12,t+d); g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.28);
  o.connect(g); g.connect(audioCtx.destination); o.start(t+d); o.stop(t+d+0.3); }); }catch(e){} }
let wheelCtx=null;
function wheelColors(i){ const c=['#C4623B','#4f8a4f','#5f6a8f','#C9A24B','#8a4f6b','#3f7a8a','#a5733f','#B23A34','#3f7a5f','#d87a99','#5c9a6f','#7a6a8a']; return c[i%c.length]; }
function setupWheel(players){ const cv=document.getElementById('wheel'); if(!cv)return; wheelCtx=cv.getContext('2d');
  App.wheel={angle:App.wheel?App.wheel.angle:0, players, spinning:false}; drawWheel(); }
function drawWheel(){ if(!wheelCtx)return; const ctx=wheelCtx, players=App.wheel.players, n=players.length, size=600, R=size/2, ang=App.wheel.angle, seg=2*Math.PI/n;
  ctx.clearRect(0,0,size,size);
  for(let i=0;i<n;i++){ const a0=ang+i*seg, a1=a0+seg;
    ctx.beginPath(); ctx.moveTo(R,R); ctx.arc(R,R,R-6,a0,a1); ctx.closePath();
    ctx.fillStyle=wheelColors(i); ctx.fill(); ctx.strokeStyle='rgba(0,0,0,.18)'; ctx.lineWidth=2; ctx.stroke();
    ctx.save(); ctx.translate(R,R); ctx.rotate(a0+seg/2); ctx.textAlign='right'; ctx.fillStyle='#fff'; ctx.font='bold 30px Inter, sans-serif';
    const nm=players[i].naam; ctx.fillText(nm.length>10?nm.slice(0,9)+'…':nm, R-26, 11); ctx.restore(); }
  ctx.beginPath(); ctx.arc(R,R,R-5,0,2*Math.PI); ctx.strokeStyle='#241c07'; ctx.lineWidth=8; ctx.stroke(); }
function wheelWinner(){ const n=App.wheel.players.length, seg=2*Math.PI/n; let rel=(-Math.PI/2-App.wheel.angle)%(2*Math.PI); if(rel<0)rel+=2*Math.PI; return Math.floor(rel/seg)%n; }
function kickSound(){ if(!audioCtx)return; try{ const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(280,t); o.frequency.exponentialRampToValueAtTime(720,t+0.13);
  g.gain.setValueAtTime(0.08,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.17);
  o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+0.18); }catch(e){} }
function spinWheel(){ if(!App.wheel||App.wheel.spinning)return; App.wheel.spinning=true;
  const res=document.getElementById('wheelRes'), btn=document.getElementById('spinBtn'); if(btn)btn.disabled=true; if(res)res.textContent='…';
  ensureAudio();
  let vel=0.30+Math.random()*0.10; const friction=0.975, reviveAt=0.038, minVel=0.006;
  let kicks = 1 + (Math.random()<0.6?1:0); // 1 of 2 onverwachte extra zetten
  let lastSeg=wheelWinner();
  const step=()=>{ App.wheel.angle=(App.wheel.angle+vel)%(2*Math.PI); vel*=friction;
    const cur=wheelWinner(); if(cur!==lastSeg){ tick(); lastSeg=cur; } drawWheel();
    if(vel<=reviveAt && kicks>0){ vel += 0.14 + Math.random()*0.10; kicks--; kickSound(); } // fakeout: versnelt weer
    if(vel>minVel){ App.wheelRAF=requestAnimationFrame(step); }
    else { App.wheel.spinning=false; const w=App.wheel.players[wheelWinner()];
      if(res)res.innerHTML=`<b>${w.naam}</b> ${promptVerb()}`; if(btn)btn.disabled=false; dingWin(); confetti(); } };
  App.wheelRAF=requestAnimationFrame(step);
}

function ratingChart(hist,ids){
  let minR=Infinity,maxR=-Infinity,maxI=0;
  ids.forEach(id=>hist[id].forEach(h=>{minR=Math.min(minR,h.r);maxR=Math.max(maxR,h.r);maxI=Math.max(maxI,h.i);}));
  if(maxI===0||!isFinite(minR)) return '';
  minR-=15;maxR+=15; const W=320,H=140,pad=10;
  const x=i=>pad+(W-2*pad)*(maxI?i/maxI:0);
  const y=r=>pad+(H-2*pad)*(1-(r-minR)/((maxR-minR)||1));
  const cols=['#C9A24B','#B23A34','#5c9a6f','#5f6a8f','#d87a99','#a5733f','#3f7a8a','#8a4f6b'];
  let paths='';
  ids.forEach((id,idx)=>{ const h=hist[id]; if(h.length<2)return; const c=cols[idx%cols.length];
    const d=h.map((pt,k)=>`${k?'L':'M'}${x(pt.i).toFixed(1)} ${y(pt.r).toFixed(1)}`).join(' ');
    paths+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const last=h[h.length-1]; paths+=`<circle cx="${x(last.i).toFixed(1)}" cy="${y(last.r).toFixed(1)}" r="3.2" fill="${c}"/>`; });
  const leg=`<div class="chart-leg">`+ids.map((id,idx)=>`<span><i style="background:${cols[idx%cols.length]}"></i>${naamVan(id)}</span>`).join('')+`</div>`;
  const base=(1000>=minR&&1000<=maxR)?`<line x1="${pad}" y1="${y(1000).toFixed(1)}" x2="${W-pad}" y2="${y(1000).toFixed(1)}" stroke="rgba(25,23,18,.18)" stroke-dasharray="3 3"/>`:'';
  return `<div class="card"><div class="eyebrow">📈 Ratingverloop</div>
    <svg viewBox="0 0 ${W} ${H}" class="rating-svg" preserveAspectRatio="none">${base}${paths}</svg>${leg}</div>`;
}

    <p>Trick-taking spel met 32 kaarten (7 t/m aas). Meestal 4 spelers, ieder 4 kaarten. Alleen de <b>laatste slag</b> telt. Volgorde hoog→laag: 10, 9, 8, 7, aas, heer, vrouw, boer.</p>
    <h3>Doel</h3><p>Zo min mogelijk strafpunten. Wie de laatste slag wint krijgt 0; de rest krijgt de inzet.</p>
    <h3>Toepen (inzet verhogen)</h3><p>Kloppen op tafel = de inzet +1. Anderen gaan mee of passen; wie past krijgt de inzet van dat moment.</p>
    <h3>Jullie regels</h3><ul>
      <li><span class="pill">dood bij 15</span> Wie 15 bereikt is af; laatste overgeblevene wint.</li>
      <li><span class="pill">vuile was</span> Vier plaatjes (of 3 plaatjes + 7) → nieuwe hand aanvragen.</li>
      <li><span class="pill">boer laatste slag = straf ×2</span> Wordt de laatste slag gewonnen met een boer → alle verliezers krijgen hun strafpunten dubbel.</li></ul>
    <h3>In de app</h3><p>Per ronde: kies winnaar, zet inzet (1 + aantal toepen), pas gepaste spelers aan, vink “met boer” aan om de straf van de verliezers te verdubbelen. Stand en dood-grens worden bijgehouden.</p>
  </div>
  <div class="card rules">
    <div class="eyebrow">♠ Boerenbridge</div>
    <p>Voorspel-spel. Elke ronde een wisselend aantal kaarten (schema 1 → piek → 1). Hoogste bieder bepaalt de troef; kleur bekennen verplicht.</p>
    <h3>Doel</h3><p>Voorspel exact hoeveel slagen je haalt. Juist → punten, ernaast → minpunten.</p>
    <h3>Biedregel (deler)</h3><p>De voorspellingen samen mogen <b>niet gelijk</b> zijn aan het aantal kaarten. De laatste bieder (deler) is dus beperkt — de app laat zien welk getal niet mag en blokkeert opslaan als het totaal tóch klopt.</p>
    <h3>Jullie puntentelling (10 + 2)</h3><ul>
      <li><span class="pill">juist</span> 10 + 2 per gehaalde slag (voorspeld 3 & gehaald 3 → 16; 0 & 0 → 10)</li>
      <li><span class="pill">fout</span> −2 per slag verschil (voorspeld 2, gehaald 4 → −4)</li></ul>
    <h3>In de app</h3><p>Voorspelling + gehaald per speler; punten live berekend. Gehaalde slagen samen moeten gelijk zijn aan de kaarten. Aan het eind van het schema wint het hoogste totaal.</p>
  </div>
  <div class="card rules">
    <div class="eyebrow">✨ Extra's</div>
    <h3>📈 Rating &amp; titels</h3><p>Elke speler heeft een Elo-rating (start 1000) die per potje meebeweegt met je eindklassering, verdeeld over al je tegenstanders. Titels als <b>Grootmeester</b>, <b>Het Orakel</b> en <b>Kanonnenvoer</b> gaan naar de koploper per categorie. Zie tab <b>Scores → Rating</b>.</p>
    <h3>🏅 Prestaties</h3><p>Verborgen badges die je ontgrendelt door te spelen (<b>Nul-Held</b>, <b>Kamikaze</b>, <b>Comeback Kid</b>…). Bij het afronden van een potje knalt de confetti als er iets nieuws bij komt. Zie tab <b>Scores → Prestaties</b>.</p>
    <h3>🎰 Kans-o-meter</h3><p>Tijdens een potje simuleert de app 2000 keer de resterende rondes en toont per speler de live winkans. Zakt iemand onder de 5%, dan mag-ie de kaarten alvast opruimen.</p>
  </div>
  <div class="hint" style="color:var(--bone-dim);padding:0 4px">Bron: Nederlandse spelregels, samengevat voor jullie afgesproken varianten.</div>`;
}

/* ============ ACTIONS ============ */
document.addEventListener('click', async (e)=>{
  const nav=e.target.closest('[data-nav]'); if(nav){ go(nav.dataset.nav); return; }
  const gTile=e.target.closest('[data-game]'); if(gTile&&!gTile.disabled){ startNieuw(gTile.dataset.game); return; }
  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act, id=a.dataset.id;
  switch(act){
    case 'switchMe': idState.mode='list'; return showIdentity(true);
    case 'idPick': return idPick(id);
    case 'idNewMode': idState.mode='create'; return renderIdentity(true);
    case 'idBack': idState.mode='list'; return renderIdentity(true);
    case 'idClose': idState.mode='list'; return hideIdentity();
    case 'idCreate': return idCreate();
    case 'idTomGo': return idTomGo();
    case 'rbCapGo': return rbCapGo();
    case 'rbCapSkip': return rbCapSkip();
    case 'openSettings': return go('settings');
    case 'toggleRb': sset('rb_on', rbOn()?'0':'1'); render(); return;
    case 'rbAssign': { const s=document.getElementById('rbAssignSel'); if(s&&s.value){ const nm=s.options[s.selectedIndex].text; await assignRb(s.value); await refresh(); toast(nm+' krijgt bij het volgende potje een verrassing 😈'); render(); } return; }
    case 'rbClearPending': await clearPending(id); await refresh(); render(); return;
    case 'rbPreview': return previewRb(a.dataset.type);
    case 'previewNew': return previewNew(a.dataset.type);
    case 'prevClose': return closePrev();
    case 'delPotje': { if(!isTom(App.me)) return; const p=App.potjes.find(x=>x.id===id); const g=p?GAMES[p.spel]:null;
      if(await confirmDialog(`Dit ${g?g.naam:'potje'} definitief verwijderen? Het telt dan nergens meer mee.`,'Verwijderen')){
        await Store.deletePotje(id); if(App.activePotje&&App.activePotje.id===id){ App.activePotje=null; App.draft=null; }
        await refresh(); render(); toast('Potje verwijderd'); } return; }
    case 'addP': return addSpeler();
    case 'delP': return delSpeler(id);
    case 'pickAvatar': App.pickerFor = App.pickerFor===id?null:id; return render();
    case 'setAvatar': await Store.setAvatar(id, a.dataset.key||null); App.pickerFor=null; await refresh(); render(); return;
    case 'selAll': return selAll();
    case 'togP': return toggleSel(id);
    case 'peak': return changePeak(parseInt(a.dataset.d));
    case 'cancelNew': App.draft=null; return go('home');
    case 'startPotje': return startPotje();
    case 'resume': return go('spel');
    case 'openReorder': App.reorder=true; return render();
    case 'closeReorder': App.reorder=false; return render();
    case 'moveUp': return move(id,-1);
    case 'moveDown': return move(id,1);
    case 'inzet': return changeInzet(parseInt(a.dataset.d));
    case 'strafPlus': return bumpStraf(id, 1);
    case 'strafMinus': return bumpStraf(id, -1);
    case 'cancelGame': return cancelGame();
    case 'pickWin': return pickWin(id);
    case 'pickDealer': App.draft.dealerId=id; return render();
    case 'toggleBoer': App.draft.metBoer=!App.draft.metBoer; return render();
    case 'scoreTab': App.scoreTab=a.dataset.tab; return render();
    case 'shareStand': return shareStand();
    case 'openRad': return go('rad');
    case 'handicap': return showHandicap();
    case 'hrNew': { const s=document.getElementById('hcWho'); return showHandicap(s&&s.value); }
    case 'hrClose': App.hcRoll=null; return closeHandicap();
    case 'hcAssign': return doAssignHandicap();
    case 'hcClear': clearHandicap(id); render(); toast('Handicap opgeheven'); return;
    case 'hcClearAll': clearAllHandicaps(); render(); toast('Alle handicaps opgeheven'); return;
    case 'toggleHc': sset('hc_on', hcOn()?'0':'1'); render(); return;
    case 'hcFreq': sset('hc_freq', a.dataset.n); render(); toast('Nu 1 op de '+a.dataset.n+' potjes'); return;
    case 'hcAllow': toggleHcAllowed(id); render(); return;
    case 'hcAssignPick': { const s=document.getElementById('hcAssignSel'); if(s&&s.value){ showHandicap(s.value); } return; }
    case 'openBier': return go('bier');
    case 'bierLog': if(App.me){ addBier(App.me, a.dataset.type); toast('Proost! 🍻 '+a.dataset.type+' ('+bierCount(App.me)+')'); render(); } return;
    case 'bierMinus': if(App.me){ removeBier(App.me, a.dataset.type); render(); } return;
    case 'bierAddType': return doAddBierType();
    case 'radPrompt': App.radPrompt=a.dataset.p; { const res=document.getElementById('wheelRes'); if(res&&!(App.wheel&&App.wheel.spinning))res.textContent=App.radPrompt; }
      document.querySelectorAll('.prompt-seg button').forEach(b=>b.classList.toggle('on',b.dataset.p===App.radPrompt)); return;
    case 'spin': return spinWheel();
    case 'openWrapped': if(!wrappedIsUnlocked()) return; App.wrappedIdx=0; return go('wrapped');
    case 'toggleWrapped': return toggleWrapped();
    case 'keepAlive': keepAlivePing(); render(); toast('Database gepingd — weer 7 dagen 🔌'); return;
    case 'wrapNext': App.wrappedIdx=Math.min((App.wrappedIdx||0)+1, wrappedSlides().length-1); return render();
    case 'wrapPrev': App.wrappedIdx=Math.max((App.wrappedIdx||0)-1,0); return render();
    case 'spelTab': App.spelTab=a.dataset.tab; return render();
    case 'saveRonde': return saveRonde();
    case 'undoRonde': return undoRonde();
    case 'finish': return finishPotje(false);
  }
});

async function addSpeler(){
  const inp=document.getElementById('newP'); if(!inp) return;
  const naam=cleanText(inp.value,24); if(!naam) return;
  if(App.spelers.some(s=>s.naam.toLowerCase()===naam.toLowerCase())){ toast('Die naam bestaat al'); return; }
  await Store.addSpeler(naam); await refresh(); render(); toast(naam+' toegevoegd');
}
async function delSpeler(id){
  if(!(await confirmDialog(`${naamVan(id)} verwijderen uit de spelerslijst?\n(Gewonnen potjes blijven in het leaderboard.)`, 'Verwijderen'))) return;
  await Store.archiveSpeler(id); await refresh(); render();
}
function startNieuw(spel){ App.draft={spel, spelerIds:[], peak:defPeak(2)}; go('nieuw'); }
function selAll(){ const all=App.spelers.map(s=>s.id);
  App.draft.spelerIds = (App.draft.spelerIds.length===all.length) ? [] : all;
  if(App.draft.spel==='boerenbridge') App.draft.peak=Math.min(App.draft.peak, maxPeak(Math.max(2,App.draft.spelerIds.length)));
  render(); }
function toggleSel(id){ const s=App.draft.spelerIds; const i=s.indexOf(id);
  if(i>=0)s.splice(i,1); else s.push(id);
  if(App.draft.spel==='boerenbridge') App.draft.peak=Math.min(App.draft.peak, maxPeak(Math.max(2,s.length)));
  render(); }
function changePeak(d){ const n=Math.max(2,App.draft.spelerIds.length);
  App.draft.peak=Math.max(1, Math.min(maxPeak(n), App.draft.peak+d)); render(); }
async function startPotje(){
  const d=App.draft;
  const p={ id:uid(), spel:d.spel, status:'bezig', spelerIds:[...d.spelerIds], volgorde:[...d.spelerIds],
    plan: d.spel==='boerenbridge'?bbPlan(Math.min(d.peak,maxPeak(d.spelerIds.length))):[],
    rondes:[], winnaarId:null, gestart:new Date().toISOString(), afgerond:null };
  await Store.savePotje(p); App.draft=null; await refresh(); armCurseForPotje(p);
  const hc=maybeAutoHandicap(p);
  go('spel');
  if(hc) setTimeout(()=>toast('🎲 Handicap voor '+naamVan(hc.id)+'!'),600);
}
async function move(id,dir){
  const p=App.activePotje; const vo=inputOrder(p); const i=vo.indexOf(id); const j=i+dir;
  if(j<0||j>=vo.length) return; [vo[i],vo[j]]=[vo[j],vo[i]];
  p.volgorde=vo; await Store.savePotje(p); await refresh(); render();
}
function changeInzet(d){ App.draft.inzet=Math.max(1,App.draft.inzet+d);  const v=document.getElementById('inzetVal'); if(v)v.textContent=App.draft.inzet;
  el.querySelectorAll('input[data-straf]').forEach(inp=>{ const id=inp.dataset.straf;
    if(App.draft.winnaarId!==id && App.draft.strafpunten[id]===undefined) inp.value=App.draft.inzet; }); }
function bumpStraf(id,d){
  if(App.draft.winnaarId===id) return;
  const cur = (App.draft.strafpunten[id] ?? App.draft.inzet);
  const nv = Math.max(0,(Number(cur)||0)+d);
  App.draft.strafpunten[id]=nv;
  const inp=el.querySelector(`input[data-straf="${id}"]`); if(inp) inp.value=nv;
}
async function cancelGame(){
  const p=App.activePotje; if(!p) return;
  if(!(await confirmDialog('Weet je het zeker? Dit potje wordt verwijderd en telt niet mee in de scores.','Ja, annuleren'))) return;
  await Store.deletePotje(p.id); App.draft=null; App.activePotje=null; App.curse=null; el&&el.classList&&el.classList.remove('rb-tilt'); await refresh(); go('home'); toast('Potje geannuleerd');
}
function pickWin(id){ if(ragebaitWinnerBlock(id)) return; App.draft.winnaarId=App.draft.winnaarId===id?null:id; render(); }

async function saveRonde(){
  if(ragebaitSaveIntercept()) return;
  const p=App.activePotje, d=App.draft, order=inputOrder(p);
  if(p.spel==='toepen'){
    if(!d.winnaarId){ toast('Kies eerst de winnaar',true); return; }
    el.querySelectorAll('input[data-straf]').forEach(inp=>{ d.strafpunten[inp.dataset.straf]=parseInt(inp.value)||0; });
    const straf={...d.strafpunten};
    delete straf[d.winnaarId];
    if(d.metBoer) for(const k in straf) straf[k]=(Number(straf[k])||0)*2; // boer: verliezers ×2
    const ronde={ winnaarId:d.winnaarId, inzet:d.inzet, metBoer:d.metBoer, strafpunten:straf };
    p.rondes.push(ronde);
  } else {
    const cards=p.plan[p.rondes.length];
    const missing=p.spelerIds.some(id=>{ const e=d.entries[id]; return e.voorspelling===''||e.gehaald===''; });
    if(missing){ toast('Vul voor iedereen voorspelling én gehaald in',true); return; }
    const sumBid=p.spelerIds.reduce((a,id)=>a+(Number(d.entries[id].voorspelling)||0),0);
    const sumTrick=p.spelerIds.reduce((a,id)=>a+(Number(d.entries[id].gehaald)||0),0);
    if(sumBid===cards){
      toast(`Voorspellingen samen mogen niet ${cards} zijn. ${naamVan(d.dealerId)} (deler) moet anders bieden.`,true); return; }
    if(sumTrick!==cards){ toast(`Gehaalde slagen samen moeten ${cards} zijn (nu ${sumTrick}).`,true); return; }
    const entries={}; p.spelerIds.forEach(id=>{ entries[id]={voorspelling:Number(d.entries[id].voorspelling)||0, gehaald:Number(d.entries[id].gehaald)||0}; });
    p.rondes.push({ entries, dealerId:d.dealerId });
  }
  App.draft=null; await Store.savePotje(p); await refresh();
  if(p.spel==='toepen'){ const alive=p.spelerIds.filter(id=>!isDood(p,id));
    if(alive.length<=1 && p.spelerIds.length>1) return finishPotje(true); }
  if(p.spel==='boerenbridge' && p.rondes.length>=p.plan.length) return finishPotje(true);
  render();
  const flair = (Math.random()<0.15) ? personaChaos(App.me,'save') : null;
  toast(flair || ('Ronde '+p.rondes.length+' opgeslagen'));
}
async function undoRonde(){ const p=App.activePotje; if(!p.rondes.length) return;
  if(!(await confirmDialog('Laatste ronde wissen?','Wissen'))) return;
  p.rondes.pop(); App.draft=null; await Store.savePotje(p); await refresh(); render(); }
async function finishPotje(auto){
  const p=App.activePotje; const g=GAMES[p.spel];
  if(!auto && !(await confirmDialog('Potje afronden en winnaar vastleggen?','Afronden'))) return;
  const before=computeAchievements().out;
  const rows=ordered(p); const winner=rows[0];
  p.status='afgerond'; p.winnaarId=winner.id; p.afgerond=new Date().toISOString();
  await Store.savePotje(p);
  await refresh();
  const after=computeAchievements().out;
  const news=[];
  for(const id of p.spelerIds){ const b=new Set(before[id]||[]); (after[id]||[]).forEach(aid=>{ if(!b.has(aid)) news.push({id,aid}); }); }
  const loser=rows[rows.length-1];
  App.lastWinner={ id:winner.id, naam:naamVan(winner.id), spel:p.spel,
    detail: g.lowerIsBetter?`${winner.tot} strafpunten`:`${winner.tot} punten`, newAch:news,
    loserId: (loser&&loser.id!==winner.id)?loser.id:null, boete: randomBoete() };
  App.draft=null; App.curse=null; el&&el.classList&&el.classList.remove('rb-tilt');
  // persona-flair voor de ingelogde speler die niet won
  if(App.me && App.me!==winner.id){ const c=personaChaos(App.me,'loss'); if(c) setTimeout(()=>toast(c),1400); }
  go('winst');
}

let toastT;
function toast(msg,err){ const t=document.getElementById('toast'); t.textContent=msg;
  t.className='toast show'+(err?' err':''); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400); }

function confirmDialog(msg, yes, no){
  return new Promise(res=>{
    const m=document.getElementById('modal');
    document.getElementById('modalMsg').textContent=msg;
    const yb=document.getElementById('modalYes'), nb=document.getElementById('modalNo');
    yb.textContent=yes||'Oké'; nb.textContent=no||'Annuleren';
    m.hidden=false;
    const done=v=>{ m.hidden=true; yb.onclick=null; nb.onclick=null; m.onclick=null; res(v); };
    yb.onclick=()=>done(true); nb.onclick=()=>done(false);
    m.onclick=e=>{ if(e.target===m) done(false); };
  });
}

/* ---- magisch woord (zachte botdrempel) ---- */
function gateNorm(s){ return (s||'').toLowerCase().replace(/[^a-z]/g,'').replace(/c/g,'k'); }
function gateGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function gateSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function initGate(){
  const gate=document.getElementById('gate'); if(!gate) return;
  const MAGIC='hokuspoker'; // "hocus pocus" voor pokeraars
  if(gateGet('kv_gate_ok')==='1'){ gate.classList.add('hidden'); return; }
  const form=document.getElementById('gateForm'), pw=document.getElementById('gatePw'),
        err=document.getElementById('gateErr'), card=document.getElementById('gateCard');
  if(!form || !pw) return;
  setTimeout(()=>{ try{ pw.focus(); }catch(e){} }, 200);
  form.addEventListener('submit', (e)=>{
    if(e) e.preventDefault();
    if(gateNorm(pw.value)===MAGIC){
      gateSet('kv_gate_ok','1'); if(err) err.textContent='';
      gate.style.transition='opacity .35s'; gate.style.opacity='0';
      setTimeout(()=>{ gate.classList.add('hidden'); gate.style.opacity=''; maybeShowIdentity(); }, 360);
    } else {
      if(err) err.textContent='Dat is niet het magische woord…';
      if(card){ card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); }
      pw.value=''; try{ pw.focus(); }catch(e2){}
    }
  });
}

/* live sync bij wijzigingen van een ander toestel */
let _syncT=null;
function softSync(){ clearTimeout(_syncT); _syncT=setTimeout(async()=>{
  try{ await loadSettings(); await refresh(); }catch(e){ return; }
  updateMeBadge();
  const typing = App.view==='spel' && (App.spelTab||'invoer')==='invoer' && !App.reorder;
  if(!needIdentity() && !typing && !document.querySelector('.rbov')) render();
},400); }

/* ---- boot ---- */
initGate();
(async function(){ await Store.init(); await loadSettings(); await refresh(); App.me=gateGet('kv_me')||null; render(); updateMeBadge(); maybeShowIdentity(); Store.subscribeRealtime(softSync); keepAlivePing(); })();
